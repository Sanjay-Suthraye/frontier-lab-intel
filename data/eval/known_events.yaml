# Known-events ground truth for the recall evaluation (fli eval --suite known_events).
#
# Written on 2026-11-04 BEFORE looking at any system output, from independent web research
# (press coverage, company releases, filings). Purpose: did the system surface the developments
# a BIT Capital PM or AI engineer would have wanted to know about, how highly did it rank them,
# and how early relative to mainstream coverage?
#
# Matching rule used by the harness: a development matches an event if it is attributed to one of
# `labs` (when given), its first_seen_at is within +/- `window_days` of `date`, and its title or
# insight titles/claims/artifacts contain at least one term from every group in `match_all`
# (case-insensitive, whole words or phrases: 'accord' does not match 'according'). When several
# developments match, the event is credited to the best one: same `event_type`, then most match
# groups in its title, then the highest score for the first audience listed, then the closest in
# time. Detection delay is measured from the publication date of the source document of the
# insight that reports the event, not from the development's first sighting.
# Confidence reflects sourcing quality at the time of writing; several events had conflicting
# details across outlets, noted in `notes` - that is part of the test (the system should cite
# primary sources and flag unconfirmed claims).
#
# Audit note (2026-11-04): the match terms of white-house-accord, openai-gpt61-shelved and
# anthropic-s1 were tightened after an audit of the harness found false matches ('accord' inside
# 'According to ...', the GPT-6.1 Sol launch counted as the shelving story, 'listing' in an API
# changelog credited as the S-1). Only `match_all` changed; the events themselves (ids, dates,
# titles, labs, audiences, windows) are unchanged and still predate any look at system output.

window: {start: "2026-08-01", end: "2026-11-04"}

events:
  - id: gdm-reshuffle-and-dean-exit
    date: "2026-08-05"
    labs: [google-deepmind, discovery-loop]
    event_type: talent_move
    title: "Jeff Dean leaves Google after 27 years to co-found Discovery Loop; DeepMind leadership reshuffle"
    audiences: [investment, ai_team]
    tickers: [GOOGL]
    match_all: [["jeff dean", "discovery loop"]]
    window_days: 7
    confidence: high
    notes: >-
      Same day: Hassabis moved from day-to-day DeepMind CEO to chair of Google DeepMind and Alphabet
      chief scientist; Koray Kavukcuoglu runs day-to-day (Gemini). Alphabet fell up to 5% intraday and
      closed down ~3.5-4% (sources differ). Reports disagree on which other researchers co-founded
      Discovery Loop (Sanjay Ghemawat named consistently; Vinyals / Quoc Le in some reports).
    evidence: ["https://www.investing.com/news/stock-market-news/alphabet-shares-fall-5-as-ai-pioneer-jeff-dean-exits-in-major-shakeup-4838743"]

