# Hand-labelled entity-resolution pairs: (tracked person, one mention) -> same | different.
# Scored by fli.register.entity_resolution.evaluate_er (`fli eval --suite er`) against config/people.yaml.
#
# Each pair is one author mention in its document context, because context is what the matcher uses:
#   person      register id (config/people.yaml)
#   mention     the author string as printed, or a handle when `platform` is set
#   lab         the document's lab when it is independent evidence (an org account or an official
#               source, never a lab inferred from the same name match)
#   coauthors   other author strings on the same document
#   categories  arXiv categories (non cs./stat./eess. papers make every name need corroboration)
#   source      observed = taken from the Aug-Oct 2026 dev corpus (HF daily papers, arXiv feed);
#               constructed = written to probe a known failure mode (namesakes, initials, order)
# Labels were assigned by hand from the person's public record; "same" pairs that the deterministic
# matcher can only place in the gray zone (initials) count against recall here, because evaluate_er
# does not call the LLM.
pairs:
