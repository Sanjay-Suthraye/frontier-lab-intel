# Register of labs - first-class entities, because much of the highest-value signal is official.
#
# tier 1: frontier labs whose official moves are material by default
# tier 2: frontier challengers / open-weight leaders (AI-team relevance, price pressure)
# tier 3: alumni startups - low volume, very high signal per item (founding, hiring, first release)
#
# public_exposure: how a development at this lab reaches public equities. Relations marked
# "verify" are reported but not confirmed from a primary source; the lens stage treats them as weak.
# Sources (feeds, orgs, accounts, boards) are declared in config/sources_*.yaml.

labs:
  - id: openai
    name: OpenAI
    kind: frontier_lab
    tier: 1
    homepage: https://openai.com
    description: Frontier lab behind GPT and ChatGPT; largest consumer AI footprint.
    public_exposure:
      - {ticker: MSFT, relation: investor_and_cloud_partner}
      - {ticker: ORCL, relation: compute_supplier, note: "Stargate compute contracts"}
      - {ticker: NVDA, relation: chip_supplier_and_investor}
      - {ticker: AMD, relation: chip_supplier, note: "6 GW supply agreement with warrants (Oct 2025)"}
      - {ticker: AVGO, relation: custom_silicon_partner, note: "co-developed inference accelerator"}
      - {ticker: TSM, relation: foundry_for_custom_silicon}
      - {ticker: AMZN, relation: compute_supplier, note: "AWS capacity agreement (Nov 2025)"}
      - {ticker: CRWV, relation: compute_supplier}
      - {ticker: "9984.T", relation: investor}
    identities:
      - {platform: x, handle: OpenAI}
      - {platform: github, handle: openai}
      - {platform: hf, handle: openai}

