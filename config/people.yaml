# Register of tracked people. Loaded by `fli register` (schema: src/fli/register/loader.py).
#
# WHO COUNTS AS "KEY" - the tier is the inclusion decision and `why_key` makes it auditable:
#   A  founders, chief scientists and heads of research of tier-1 labs, and founders of alumni
#      startups. A move by a tier-A person is material for both audiences (config/materiality.yaml).
#   B  named leads of flagship model work (pretraining, post-training, reasoning, infra, safety,
#      interpretability, agents/coding and the flagship product surface) and frequent authors of
#      flagship reports: the layer below the founders, where most early signal sits.
#   C  high-signal individual contributors: maintainers of lab repos, prolific technical posters,
#      and alumni we watch for their next venture.
#   inclusion_rule: seed_founder | lab_leadership | flagship_lead | flagship_author |
#                   alumni_founder | high_signal_poster | talent_watch
#
# CURRENT AFFILIATION of every tier-A/B person was checked by web search on 2026-11-04
# (meta.verified_on, meta.verification = the source read). Moves are dated affiliations with a
# source_url. `lab` is the current employer when it is in config/labs.yaml, otherwise null (the org
# is in the affiliations), so papers written by alumni are never attributed to their former lab.
# Month-precision dates use the 1st of the month; unknown start dates of long-held roles are omitted.
# Affiliation confidence < 1 marks moves reported by secondary sources only.
#
# IDENTITIES: x | github | hf | bluesky | arxiv_name | s2 | homepage | scholar. arxiv_name is the
# name as printed on arXiv. It is left out for very common names (it would flood the arXiv author
# feed with namesakes); those people carry meta.common_name: true, and entity resolution then needs
# lab or co-author agreement even for an exact name match.
#
# X TRACKING (track: true): X reads cost $0.005 per post and share the X_BUDGET_TOTAL_USD hard cap
# with the lab accounts. 25 accounts are tracked. Worst-case backfill is 25 x 60 posts = $7.50 (the
# collector's default cap), which together with the lab accounts' planned ~$3.4 would hit the $10 cap
# (the guard stops reads cleanly). Estimate, not yet measured: most of these accounts post a few
# originals a week, so backfill ~$3 and steady state ~$0.05/day. `max_posts: 30` is set for when the
# loader passes it through (requested), which halves the worst case. Chosen because their posts are
# first-hand primary signal that the lab account does not duplicate:
#   (1) leaders who announce strategy, compute deals and moves themselves (sama, gdb, demishassabis,
#       alexandr_wang, jackclarkSF);
#   (2) research leads whose rare posts are high-signal and nearly free (merettm, markchen90,
#       polynoamial, NoamShazeer, lilianweng, janleike, ch402, shengjia_zhao, barret_zoph);
#   (3) builders who ship API/tooling changes before the docs (OfficialLoganK, bcherny, karpathy,
#       soumithchintala);
#   (4) founders of alumni startups with little official output (ilyasut, miramurati,
#       johnschulman2, MishaLaskin, LiamFedus, JeffDean, OriolVinyalsML).
# Not tracked: elonmusk (hundreds of posts a day would exhaust the cap; @xai covers launches),
# ylecun (very high volume, mostly commentary) and everyone whose news reaches an official source.
#
# meta.revealed_preference is the validation label of the contributor score
# (src/fli/register/contributors.py). true: a cited public report shows that in 2024-2026 the person
#   (a) was recruited away by a competing lab or company in coverage that frames it as poaching or
#       reports the package or deal value, or
#   (b) co-founded an alumni startup that raised >= $100M or is backed by a frontier lab/hyperscaler.
# false: no such report found (checked 2026-11-04). null: a move happened but neither poaching
# framing nor money was reported; excluded from validation.
# meta.roles: leadership/flagship roles ever held, EXCLUDING the role that is itself the
# revealed-preference event (the founding, or the job someone was poached into), so the
# leadership-roles feature cannot encode the label. meta.profile: research | leadership | product.

