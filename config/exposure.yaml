# Exposure map: the closed list of public companies a lab development can be mapped to.
# The LLM lens stage may only choose tickers from this file, so it cannot invent exposures.
#
# BIT holdings: top-10 positions of BIT Global Technology Leaders (flagship, EUR 1,557.5m)
# per the HANSAINVEST factsheet "Angaben per 30.09.2026". Re-check monthly.
as_of: "2026-09-30"
holdings_source: "BIT Global Technology Leaders factsheet (HANSAINVEST), Angaben per 30.09.2026"

bit_holdings:
  - {symbol: AMZN, weight: 9.6, funds: [BIT Global Technology Leaders]}
  - {symbol: IREN, weight: 9.2, funds: [BIT Global Technology Leaders]}
  - {symbol: NVDA, weight: 8.0, funds: [BIT Global Technology Leaders]}
  - {symbol: MU, weight: 6.5, funds: [BIT Global Technology Leaders]}
  - {symbol: TSM, weight: 5.1, funds: [BIT Global Technology Leaders]}
  - {symbol: META, weight: 4.6, funds: [BIT Global Technology Leaders]}
  - {symbol: MSFT, weight: 4.4, funds: [BIT Global Technology Leaders]}
  - {symbol: HNGE, weight: 4.0, funds: [BIT Global Technology Leaders]}
  - {symbol: SIMO, weight: 3.9, funds: [BIT Global Technology Leaders]}
  # "FT Inter" (4.0%) is listed in the factsheet top 10 but could not be mapped to a ticker; left out.

themes:
  - id: accelerators
    name: AI accelerators and custom silicon
    description: Demand for, and competition among, training/inference chips. Custom ASICs and TPUs compete with GPUs.
    tickers: [NVDA, AMD, AVGO, MRVL, ARM, INTC]
    event_types: [compute_deal, custom_silicon, model_release, capability_claim, open_weight_release]
    keywords: [gpu, accelerator, tpu, trainium, asic, chip, blackwell, rubin, inference chip, cluster, h100, gb200, gb300]
  - id: foundry_equipment
    name: Foundry, packaging and equipment
    description: Every accelerator, custom or not, is fabbed and packaged by a small set of suppliers.
    tickers: [TSM, ASML, AMAT, LRCX, KLAC]
    event_types: [custom_silicon, compute_deal]
    keywords: [tsmc, wafer, packaging, cowos, 2nm, 3nm, foundry, tape-out, tapeout]
  - id: memory_storage
    name: Memory (HBM) and storage
    description: Larger models, longer context and agentic inference raise HBM, DRAM and NAND demand.
    tickers: [MU, "000660.KS", "005930.KS", SIMO, SNDK, WDC, STX]
    event_types: [compute_deal, custom_silicon, model_release, open_weight_release, capability_claim, research_paper, technique]
    # only unambiguous memory terms: 'context window' linked MU/SIMO to every launch, 'memory' matched agent memory,
    # 'storage' matched data-retention changes
    keywords: [hbm, high-bandwidth memory, memory bandwidth, dram, nand, ssd, kv cache]
  - id: networking_optics
    name: Networking and optics
    description: Scale-out clusters need switches, interconnect and optical transceivers.
    tickers: [ANET, AVGO, CRDO, ALAB, COHR, LITE]
    event_types: [compute_deal, custom_silicon]
    keywords: [interconnect, networking, optical, ethernet, infiniband, nvlink, scale-out, transceiver]
  - id: neocloud_capacity
    name: Neoclouds and AI datacenter capacity
    description: Labs buy capacity from GPU clouds and converted bitcoin-mining sites; contracts re-rate these stocks.
    tickers: [IREN, CRWV, NBIS, CIFR, WULF, HUT, CORZ, APLD, GLXY, AKAM, ORCL]
    event_types: [compute_deal, energy_deal, funding_ipo, strategy_shift]
    keywords: [datacenter, data center, gigawatt, gw, capacity, lease, colocation, gpu cloud, compute contract, campus]
  - id: hyperscaler_partners
    name: Hyperscalers and lab partners
    description: Cloud partners and strategic investors whose economics move with their lab's fortunes.
    tickers: [MSFT, AMZN, GOOGL, ORCL, META, BABA, "9984.T"]
    event_types: [compute_deal, partnership, funding_ipo, model_release, product_launch, strategy_shift, talent_move]
    keywords: [azure, aws, google cloud, bedrock, vertex, stake, investment, partnership, exclusive]
  - id: power_energy
    name: Power and datacenter infrastructure
    description: Electricity, generation and cooling are the binding constraint on AI capacity.
    tickers: [VST, CEG, TLN, NRG, GEV, BE, OKLO, SMR, VRT, ETN]
    event_types: [energy_deal, compute_deal]
    keywords: [power, energy, nuclear, gas turbine, grid, megawatt, mw, gigawatt, gw, cooling, ppa, electricity]
  - id: software_disruption
    name: Software exposed to AI substitution
    description: Agentic products from labs compete with seat-based SaaS and information services.
    tickers: [CRM, NOW, ADBE, INTU, WDAY, IBM, FDS, SPGI, TRI, RELX, TEAM, HUBS, DUOL]
    event_types: [product_launch, model_release, capability_claim, strategy_shift, pricing_change, partnership]
    keywords: [agent, agentic, automation, enterprise, legal, finance, coding, office, workflow, plugin, copilot, spreadsheet]
  - id: cybersecurity
    name: Cybersecurity
    description: Frontier cyber capabilities are both a threat to and a product for security vendors.
    tickers: [CRWD, PANW, ZS, OKTA, NET]
    event_types: [product_launch, capability_claim, safety_policy, model_release]
    keywords: [security, vulnerability, cyber, exploit, red team, malware, zero-day]
  - id: ai_consumer_apps
    name: Consumer and vertical AI applications
    description: Consumer platforms and vertical apps whose products or moats depend on model capability and cost.
    tickers: [META, GOOGL, RDDT, HNGE, HIMS, LMND, DUOL]
    event_types: [product_launch, model_release, partnership, pricing_change, capability_claim]
    keywords: [health, search, ads, social, data licensing, browser]  # 'consumer'/'assistant' matched almost everything
  - id: lab_capital_markets
    name: Lab financing, IPOs and stakes
    description: Lab valuations flow through to holders of stakes and to the listing pipeline.
    tickers: [ANT, MSFT, AMZN, GOOGL, NVDA, "9984.T"]
    event_types: [funding_ipo, new_venture, talent_move]
    keywords: [ipo, s-1, valuation, funding round, tender, secondary, stake, raise]
  - id: china_ai
    name: China AI and export controls
    description: Cheap Chinese open-weight models pressure pricing; export controls shape accelerator demand.
    tickers: [BABA, NVDA, AMD]
    event_types: [open_weight_release, model_release, safety_policy, pricing_change]
    keywords: [deepseek, qwen, kimi, china, export control, huawei, ascend]

